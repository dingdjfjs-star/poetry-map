<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗词地图 · 唐诗宋词里的山河</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="seal">诗</span>
    <div class="brand-t">
      <h1>诗词地图</h1>
      <span class="sub">唐诗宋词里的山河 · 地名考据版</span>
    </div>
  </div>
  <div id="stats" class="stats"></div>
  <div class="tools">
    <div class="seg" id="basemapSeg">
      <button data-bm="ink" class="on">水墨</button>
      <button data-bm="dark">暗色</button>
      <button data-bm="osm">街道</button>
    </div>
    <button id="btnAudit" class="btn ghost" title="地名匹配核查与修正记录">◉ 数据核查</button>
    <button id="btnFit" class="btn ghost" title="缩放至全部点位">全域</button>
  </div>
</header>

<aside id="sidebar">
  <div class="search-row">
    <input id="search" type="text" placeholder="搜诗题 / 诗人 / 地名，如：扬州、李白、赤壁…">
  </div>
  <div class="chips" id="dynastyChips"></div>
  <div class="poet-row">
    <select id="poetSel"><option value="">诗人游历路线：全部 / 自选…</option></select>
    <button id="btnClearRoute" class="btn ghost sm" title="清除路线">✕</button>
  </div>
  <div class="list-head"><span id="listCount"></span><label class="deb-toggle"><input type="checkbox" id="debOnly">只看存疑点位</label></div>
  <ul id="poemList"></ul>
  <div class="side-foot">数据由 tools/build.js 自动匹配生成<br>人工核查见 report/核查报告.md</div>
</aside>

<main id="map"></main>

<section id="detail" class="panel hidden">
  <button class="close" id="detailClose">✕</button>
  <div id="detailBody"></div>
</section>

<section id="routeCard" class="panel hidden">
  <button class="close" id="routeClose">✕</button>
  <div id="routeBody"></div>
</section>

<div id="auditModal" class="modal hidden">
  <div class="modal-box">
    <header><h2>◉ 地名匹配核查台</h2>
      <span id="auditStats"></span>
      <button class="close" id="auditClose">✕</button>
    </header>
    <div id="auditBody" class="modal-body"></div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
